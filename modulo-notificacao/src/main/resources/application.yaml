modulo-mensageria:
  uri: http://localhost:8085
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

spring:
  application:
    name: modulo-notificacao
  datasource:
    url: jdbc:postgresql://localhost:5433/dose_alerta
    username: dose_alerta
    password: dose_alerta
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8084

security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}

scheduler:
  outbox:
    intervalo-ms: 15000
