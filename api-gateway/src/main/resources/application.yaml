modulo-usuario:
  uri: http://localhost:8081
modulo-ia:
  uri: http://localhost:8082
modulo-scheduler:
  uri: http://localhost:8083
modulo-relatorio-adesao:
  uri: http://localhost:8086

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: modulo-usuario
              uri: ${modulo-usuario.uri}
              predicates:
                - Path=/pacientes,/auth/login
            # Somente o que o paciente/profissional usa é exposto na borda. Endpoints internos (POST /alarmes,
            # /alarmes/confirmacoes, /notificacoes/**, /mensagens/**, /ligacoes/**, /interacoes) e os webhooks da
            # Twilio ficam de fora: são chamados entre módulos, sem JWT.
            - id: modulo-ia
              uri: ${modulo-ia.uri}
              predicates:
                - Path=/receitas/**
            - id: modulo-scheduler-consulta-alarme
              uri: ${modulo-scheduler.uri}
              predicates:
                - Path=/alarmes/*
                - Method=GET
            - id: modulo-relatorio-adesao
              uri: ${modulo-relatorio-adesao.uri}
              predicates:
                - Path=/pacientes/*/adesao
                - Method=GET

server:
  port: 8080

security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    capacidade: 60
    janela-ms: 60000
    confiar-x-forwarded-for: ${RATE_LIMIT_CONFIAR_X_FORWARDED_FOR:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

logging:
  structured:
    format:
      console: logstash
