modulo-usuario:
  uri: http://localhost:8081
modulo-ia:
  uri: http://localhost:8082
modulo-scheduler:
  uri: http://localhost:8083
modulo-relatorio-adesao:
  uri: http://localhost:8086
modulo-mensageria:
  uri: http://localhost:8085

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: modulo-usuario
              uri: ${modulo-usuario.uri}
              predicates:
                - Path=/pacientes,/auth/login
            # Somente o que o paciente/profissional usa, e os webhooks da Twilio, são expostos na borda. Endpoints
            # internos (POST /alarmes, /alarmes/confirmacoes, /notificacoes/**, /mensagens/**, /ligacoes/**,
            # /interacoes) ficam de fora: só são chamados entre módulos, sem JWT — se fossem expostos aqui,
            # qualquer um com a URL do túnel poderia disparar mensagens e ligações pela sua conta Twilio.
            - id: modulo-ia
              uri: ${modulo-ia.uri}
              predicates:
                - Path=/receitas/**
            - id: modulo-scheduler-consulta-alarme
              uri: ${modulo-scheduler.uri}
              predicates:
                - Path=/alarmes/*
                - Method=GET
            - id: modulo-relatorio-adesao
              uri: ${modulo-relatorio-adesao.uri}
              predicates:
                - Path=/pacientes/*/adesao
                - Method=GET
            # Sem JWT (a Twilio não manda um; ela assina com X-Twilio-Signature, verificado pelo modulo-mensageria
            # a partir de TWILIO_WEBHOOK_BASE_URL — que passa a ser a URL pública do gateway, não do módulo).
            - id: modulo-mensageria-webhooks-twilio
              uri: ${modulo-mensageria.uri}
              predicates:
                - Path=/webhooks/twilio/**

server:
  port: 8080

security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    capacidade: 60
    janela-ms: 60000
    confiar-x-forwarded-for: ${RATE_LIMIT_CONFIAR_X_FORWARDED_FOR:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

logging:
  structured:
    format:
      console: logstash
