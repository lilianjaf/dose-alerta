modulo-usuario:
  uri: http://localhost:8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: modulo-usuario
              uri: ${modulo-usuario.uri}
              predicates:
                - Path=/pacientes,/auth/login

server:
  port: 8080

security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

logging:
  structured:
    format:
      console: logstash
