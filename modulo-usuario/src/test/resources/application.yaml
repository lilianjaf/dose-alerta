spring:
  application:
    name: modulo-usuario
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

modulo-sus-mock:
  uri: http://localhost:8087
  connect-timeout-ms: 2000
  read-timeout-ms: 2000

server:
  port: 8081

security:
  jwt:
    issuer: modulo-usuario

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 0.0
