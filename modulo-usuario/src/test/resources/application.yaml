spring:
  application:
    name: modulo-usuario
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8081

security:
  jwt:
    issuer: modulo-usuario

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 0.0
