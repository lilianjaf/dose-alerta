plugins {
	id 'org.springframework.boot'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
	implementation 'com.nimbusds:nimbus-jose-jwt:9.37.3'
	implementation 'com.twilio.sdk:twilio:13.0.1'
	// MultipartBodyBuilder (usado para reenviar a foto da receita ao modulo-ia) referencia tipos do Reactive
	// Streams em tempo de carregamento de classe, mesmo em uso 100% síncrono.
	implementation 'org.reactivestreams:reactive-streams'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation project(':contratos')
	testImplementation 'org.mockito:mockito-core'
}
