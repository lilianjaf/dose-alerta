spring:
  application:
    name: modulo-scheduler
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8083

modulo-notificacao:
  uri: http://localhost:8084
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

modulo-relatorio-adesao:
  uri: http://localhost:8086
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

scheduler:
  escalonamento:
    intervalo-ms: 3600000
  outbox:
    intervalo-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 0.0
