spring:
  application:
    name: modulo-scheduler
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8083

modulo-notificacao:
  uri: http://localhost:8084
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

scheduler:
  escalonamento:
    intervalo-ms: 60000
  outbox:
    intervalo-ms: 15000
