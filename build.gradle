plugins {
	id 'org.owasp.dependencycheck' version '13.0.0'
	id 'org.springframework.boot' version '4.1.1' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

dependencyCheck {
	failBuildOnCVSS = 7.0f
	formats = ['HTML', 'SARIF']
	suppressionFile = file('config/dependency-check-suppressions.xml').path
	nvd {
		apiKey = System.getenv('NVD_API_KEY')
	}
}

allprojects {
	group = 'com.dosealerta'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'
	apply plugin: 'jacoco'
	apply plugin: 'checkstyle'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(26)
		}
	}

	checkstyle {
		toolVersion = '14.1.0'
		configFile = rootProject.file('config/checkstyle/checkstyle.xml')
		maxWarnings = 0
	}

	dependencyManagement {
		imports {
			mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.1"
		}
	}

	dependencies {
		testImplementation 'org.junit.platform:junit-platform-launcher'
	}

	tasks.named('test') {
		useJUnitPlatform {
			excludeTags 'carga'
		}
		finalizedBy 'jacocoTestReport'
	}

	tasks.register('testeCarga', Test) {
		description = 'Roda os testes de carga (tag "carga").'
		group = 'verification'
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		useJUnitPlatform {
			includeTags 'carga'
		}
		systemProperties System.properties.findAll { k, v -> k.toString().startsWith('carga.') }
		testLogging.showStandardStreams = true
		shouldRunAfter 'test'
	}

	tasks.named('jacocoTestCoverageVerification') {
		dependsOn 'test'
		violationRules {
			rule {
				limit {
					counter = 'LINE'
					minimum = 0.80
				}
			}
			rule {
				element = 'PACKAGE'
				includes = ['com.dosealerta.*.core.domain', 'com.dosealerta.*.core.usecase', 'com.dosealerta.*.core.rules']
				limit {
					counter = 'LINE'
					minimum = 0.90
				}
			}
		}
	}

	tasks.named('check') {
		dependsOn 'jacocoTestCoverageVerification'
	}

	tasks.named('jacocoTestReport') {
		dependsOn 'test'
		reports {
			xml.required = true
		}
	}
}
