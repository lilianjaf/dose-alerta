modulo-scheduler:
  uri: http://localhost:8083
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

spring:
  application:
    name: modulo-ia
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/dose_alerta}
    username: ${DB_USERNAME:dose_alerta}
    password: ${DB_PASSWORD:dose_alerta}
    # Schema próprio por módulo: todos compartilham o mesmo banco, e as tabelas (ex.: outbox_event)
    # e o histórico do Flyway colidiriam no schema public.
    hikari:
      schema: ia
  jpa:
    properties:
      hibernate:
        default_schema: ia
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: ia
    default-schema: ia
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8082

security:
  jwt:
    public-key: ${JWT_PUBLIC_KEY}

ia:
  modelo: claude-opus-5

scheduler:
  outbox:
    intervalo-ms: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

logging:
  structured:
    format:
      console: logstash
