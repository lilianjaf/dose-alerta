spring:
  application:
    name: modulo-ia
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8082

modulo-scheduler:
  uri: http://localhost:8083
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

ia:
  modelo: claude-opus-5

scheduler:
  outbox:
    intervalo-ms: 15000
