spring:
  application:
    name: modulo-ia
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8082

modulo-scheduler:
  uri: http://localhost:8083
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

ia:
  modelos: gemini-3.5-flash-lite,gemini-3.8-flash

scheduler:
  outbox:
    intervalo-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 0.0
