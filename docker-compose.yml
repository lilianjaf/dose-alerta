services:
  postgres:
    image: postgres:16-alpine
    container_name: dose-alerta-postgres
    environment:
      POSTGRES_DB: dose_alerta
      POSTGRES_USER: dose_alerta
      POSTGRES_PASSWORD: dose_alerta
    ports:
      - "5433:5432"
    volumes:
      - dose-alerta-postgres-data:/var/lib/postgresql/data

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: dose-alerta-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  dose-alerta-postgres-data:
