name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dose_alerta
          POSTGRES_USER: dose_alerta
          POSTGRES_PASSWORD: dose_alerta
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build, testes, lint e cobertura minima
        run: ./gradlew build

      - name: Publicar relatorios de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: '**/build/reports/jacoco/test/'
          if-no-files-found: ignore

  seguranca-dependencias:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Cache da base NVD
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Scan de dependencias
        if: env.NVD_API_KEY != ''
        run: ./gradlew dependencyCheckAggregate
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Scan de dependencias pulado (secret NVD_API_KEY ausente)
        if: env.NVD_API_KEY == ''
        run: echo "::warning::Secret NVD_API_KEY nao configurado - scan de dependencias nao executado."
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Publicar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check
          path: build/reports/
          if-no-files-found: ignore

  carga:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Testes de carga
        run: ./gradlew testeCarga
